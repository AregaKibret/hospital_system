{% extends "base.html" %}
{% block title %}Adjust Stock — {{ item.name }}{% endblock %}
{% block content %}
<div class="max-w-lg">
  <nav class="text-xs text-slate-400 mb-3"><a href="{% url 'store_item_detail' item.pk %}" class="hover:text-blue-600">{{ item.name }}</a> / Adjust Stock</nav>
  <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-1">Manual Stock Adjustment</h1>
  <p class="text-sm text-slate-500 mb-5">Current stock: <strong>{{ item.quantity_in_stock|floatformat:0 }} {{ item.unit }}</strong></p>

  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Adjustment Type</label>
      <div class="flex gap-3">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="adj_type" value="in" checked class="text-blue-600"> <span class="text-sm text-slate-700 dark:text-slate-300">Add (In)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="adj_type" value="out" class="text-red-600"> <span class="text-sm text-slate-700 dark:text-slate-300">Remove (Out)</span>
        </label>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Quantity <span class="text-red-500">*</span></label>
      <input type="number" name="quantity" step="0.0001" min="0.0001" required
             class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white"
             placeholder="{{ item.unit }}">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Reference</label>
      <input type="text" name="reference" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white" placeholder="e.g. SC-2025-001">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Reason / Notes <span class="text-red-500">*</span></label>
      <textarea name="notes" rows="2" required class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white" placeholder="Reason for adjustment"></textarea>
    </div>
    <div class="flex gap-3">
      <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors">Apply Adjustment</button>
      <a href="{% url 'store_item_detail' item.pk %}" class="px-5 py-2.5 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm font-semibold rounded-lg hover:bg-slate-50 transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
