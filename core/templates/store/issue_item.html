{% extends "base.html" %}
{% block title %}Issue — {{ item.name }}{% endblock %}
{% block content %}
<div class="max-w-lg">
  <nav class="text-xs text-slate-400 mb-3"><a href="{% url 'store_item_detail' item.pk %}" class="hover:text-blue-600">{{ item.name }}</a> / Issue to Department</nav>
  <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-1">Issue Item</h1>
  <p class="text-sm text-slate-500 mb-5">Available: <strong>{{ item.quantity_in_stock|floatformat:0 }} {{ item.unit }}</strong></p>

  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Issue To (Department)</label>
      <select name="department" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
        <option value="">— Select Department —</option>
        {% for dept in departments %}<option value="{{ dept.pk }}">{{ dept.name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Quantity <span class="text-red-500">*</span></label>
      <input type="number" name="quantity" step="0.0001" min="0.0001" max="{{ item.quantity_in_stock }}" required
             class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white"
             placeholder="{{ item.unit }}">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Reference / Requisition #</label>
      <input type="text" name="reference" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Notes</label>
      <textarea name="notes" rows="2" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-white"></textarea>
    </div>
    <div class="flex gap-3">
      <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition-colors">Issue Items</button>
      <a href="{% url 'store_item_detail' item.pk %}" class="px-5 py-2.5 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 text-sm font-semibold rounded-lg hover:bg-slate-50 transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
