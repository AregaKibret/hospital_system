{% extends "base.html" %}
{% block title %}Add Growth Record{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto space-y-6">
  <div>
    <a href="{% url 'growth_record_list' patient.pk %}" class="text-sm text-indigo-600 hover:underline">&larr; Growth Records</a>
    <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100 mt-2">Add Growth Record</h1>
    <p class="text-sm text-slate-500">{{ patient }}</p>
  </div>
  <form method="post" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6 shadow-sm space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div><label class="form-label">Date *</label><input type="date" name="record_date" required class="form-input w-full" value="{{ today }}"></div>
      <div><label class="form-label">Age (months)</label><input type="number" name="age_months" class="form-input w-full"></div>
      <div><label class="form-label">Weight (kg)</label><input type="number" step="0.01" name="weight_kg" class="form-input w-full"></div>
      <div><label class="form-label">Height (cm)</label><input type="number" step="0.1" name="height_cm" class="form-input w-full"></div>
      <div><label class="form-label">Head Circumference (cm)</label><input type="number" step="0.1" name="head_circumference" class="form-input w-full"></div>
      <div><label class="form-label">MUAC (cm)</label><input type="number" step="0.1" name="muac_cm" class="form-input w-full"></div>
      <div><label class="form-label">W/A Z-score</label><input type="number" step="0.01" name="weight_for_age_z" class="form-input w-full"></div>
      <div><label class="form-label">H/A Z-score</label><input type="number" step="0.01" name="height_for_age_z" class="form-input w-full"></div>
      <div><label class="form-label">W/H Z-score</label><input type="number" step="0.01" name="weight_for_height_z" class="form-input w-full"></div>
    </div>
    <div><label class="form-label">Notes</label><textarea name="notes" rows="2" class="form-input w-full"></textarea></div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Save Record</button>
      <a href="{% url 'growth_record_list' patient.pk %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
