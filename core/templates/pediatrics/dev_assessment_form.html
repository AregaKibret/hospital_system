{% extends "base.html" %}
{% block title %}Developmental Assessment{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
  <div>
    <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">Developmental Assessment</h1>
    <p class="text-sm text-slate-500">{{ patient }}</p>
  </div>
  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div><label class="form-label">Assessment Date *</label><input type="date" name="assessment_date" required class="form-input w-full" value="{{ today }}"></div>
        <div><label class="form-label">Age (months) *</label><input type="number" name="age_months" required class="form-input w-full" min="0"></div>
        <div>
          <label class="form-label">Outcome</label>
          <select name="outcome" class="form-input w-full">
            {% for val,label in outcome_choices %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
          </select>
        </div>
      </div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-4">Developmental Domains</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="form-label">Gross Motor</label><textarea name="gross_motor" rows="3" class="form-input w-full" placeholder="Rolling, sitting, walking…"></textarea></div>
        <div><label class="form-label">Fine Motor</label><textarea name="fine_motor" rows="3" class="form-input w-full" placeholder="Grasping, pincer grip…"></textarea></div>
        <div><label class="form-label">Language</label><textarea name="language" rows="3" class="form-input w-full" placeholder="Babbling, words, sentences…"></textarea></div>
        <div><label class="form-label">Social / Personal</label><textarea name="social_personal" rows="3" class="form-input w-full" placeholder="Social smile, stranger anxiety…"></textarea></div>
        <div><label class="form-label">Cognitive</label><textarea name="cognitive" rows="3" class="form-input w-full" placeholder="Object permanence, problem solving…"></textarea></div>
      </div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm space-y-4">
      <div><label class="form-label">Milestones Met</label><textarea name="milestones_met" rows="2" class="form-input w-full"></textarea></div>
      <div><label class="form-label">Milestones Missed</label><textarea name="milestones_missed" rows="2" class="form-input w-full"></textarea></div>
      <div><label class="form-label">Recommendations</label><textarea name="recommendations" rows="3" class="form-input w-full"></textarea></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="form-label">Next Assessment</label><input type="date" name="next_assessment" class="form-input w-full"></div>
      </div>
      <div><label class="form-label">Notes</label><textarea name="notes" rows="2" class="form-input w-full"></textarea></div>
    </div>
    <div class="flex gap-3">
      <button type="submit" class="btn btn-primary" data-loading>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Save Assessment
      </button>
      <a href="{% url 'peds_consultation_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
