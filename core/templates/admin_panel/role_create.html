{% extends "base.html" %}
{% block title %}Create Role{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-6">
  <div>
    <a href="{% url 'role_list' %}" class="text-sm text-indigo-600 hover:underline">&larr; All Roles</a>
    <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mt-2">Create New Role</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">After creating, you'll be taken to the permission editor.</p>
  </div>

  <form method="post" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-5">
    {% csrf_token %}
    <div class="field-wrapper">
      <label class="field-label">Role Name *</label>
      <input type="text" name="name" value="{{ post.name|default:'' }}" required class="field-input" placeholder="e.g. Senior Nurse, Lab Manager">
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">Use a clear, job-title style name. Role names must be unique.</p>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Create & Configure Permissions</button>
      <a href="{% url 'role_list' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
