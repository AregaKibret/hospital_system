{% extends "base.html" %}
{% block title %}New Handover Note — HMS{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-6">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'nursing_handover_list' %}" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </a>
    <h1 class="text-xl font-bold text-gray-900 dark:text-white">New Shift Handover Note</h1>
  </div>

  <form method="post" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Ward <span class="text-red-500">*</span></label>
        {{ form.ward }}
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Shift <span class="text-red-500">*</span></label>
        {{ form.shift }}
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Date</label>
        {{ form.handover_date }}
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">To Nurse <span class="text-gray-400 font-normal">(optional)</span></label>
        {{ form.to_nurse }}
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Patient <span class="text-gray-400 font-normal">(optional — leave blank for a ward-wide note)</span></label>
      {{ form.patient }}
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Note <span class="text-red-500">*</span></label>
      {{ form.content }}
    </div>
    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
      {{ form.priority_flag }}
      Flag as priority
    </label>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn btn-primary" data-loading>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Save Note
      </button>
      <a href="{% url 'nursing_handover_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
<script>
  document.querySelectorAll('form input:not([type="checkbox"]):not([type="submit"]), form select, form textarea').forEach(el => {
    el.className = 'w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none transition';
  });
</script>
{% endblock %}
