{# Shared certificate print styling + toolbar. Expects: back_url #}
<div class="flex items-center justify-between mb-5 no-print">
  <a href="{{ back_url }}" class="btn-secondary text-sm">← Back</a>
  <button onclick="window.print()" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold transition-colors">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
    Print / PDF
  </button>
</div>

<style>
@media print {
  .no-print, nav, header, footer, .hms-nav,
  form, button, [data-no-print] { display: none !important; }
  body { background: white !important; color: black !important; }
  .bg-white, .dark\:bg-slate-800 { background: white !important; border: 1px solid #e2e8f0; }
  @page {
    margin: 1.2cm;
    @bottom-center { content: "Page " counter(page) " of " counter(pages); font-size: 9px; color: #888; }
  }
}
</style>
