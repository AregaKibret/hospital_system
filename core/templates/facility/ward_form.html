{% extends "base.html" %}
{% block title %}{{ action }} Ward{% endblock %}
{% block content %}

<div class="flex items-center gap-3 mb-6">
  <a href="{% url 'ward_list' %}" class="btn-secondary text-sm">← Back to Wards</a>
  <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ action }} Ward</h1>
</div>

{% if messages %}
<div class="mb-4 space-y-2">{% for m in messages %}<div class="px-4 py-2.5 rounded-xl text-sm font-medium bg-red-50 text-red-700 border border-red-200 dark:bg-red-900/20 dark:text-red-400">{{ m }}</div>{% endfor %}</div>
{% endif %}

<form method="post" class="max-w-2xl">{% csrf_token %}
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="field-wrapper">
        <label class="field-label">Ward Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" value="{{ ward.name|default:'' }}" required class="field-input" placeholder="e.g. Medical Ward A" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Ward Code <span class="text-red-500">*</span></label>
        <input type="text" name="code" value="{{ ward.code|default:'' }}" required class="field-input" placeholder="e.g. WARD-MED-A" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Ward Type</label>
        <select name="ward_type" class="field-input">
          {% for val, label in ward_types %}<option value="{{ val }}" {% if ward and ward.ward_type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper">
        <label class="field-label">Department</label>
        <select name="department" class="field-input">
          <option value="">— None —</option>
          {% for d in departments %}<option value="{{ d.pk }}" {% if ward and ward.department_id == d.pk %}selected{% endif %}>{{ d.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper">
        <label class="field-label">Building</label>
        <select name="building" class="field-input">
          <option value="">— None —</option>
          {% for b in buildings %}<option value="{{ b.pk }}" {% if ward and ward.building_id == b.pk %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper">
        <label class="field-label">Floor</label>
        <select name="floor" class="field-input">
          <option value="">— None —</option>
          {% for f in floors %}<option value="{{ f.pk }}" {% if ward and ward.floor_id == f.pk %}selected{% endif %}>{{ f.building.name }} — {{ f.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper">
        <label class="field-label">Gender Restriction</label>
        <select name="gender_restriction" class="field-input">
          {% for val, label in gender_choices %}<option value="{{ val }}" {% if ward and ward.gender_restriction == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
        <input type="checkbox" name="is_isolation" {% if ward.is_isolation %}checked{% endif %} class="w-4 h-4 rounded" /> Isolation Ward
      </label>
      <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
        <input type="checkbox" name="is_icu_hdu" {% if ward.is_icu_hdu %}checked{% endif %} class="w-4 h-4 rounded" /> ICU / HDU
      </label>
    </div>
    <div class="field-wrapper">
      <label class="field-label">Notes</label>
      <textarea name="notes" rows="2" class="field-input">{{ ward.notes|default:'' }}</textarea>
    </div>
  </div>
  <div class="flex gap-3 mt-5">
    <button type="submit" class="btn btn-primary" data-loading>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      {{ action }} Ward
    </button>
    <a href="{% url 'ward_list' %}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
