{% extends "base.html" %}
{% block title %}{{ action }} Building{% endblock %}
{% block content %}

<div class="flex items-center gap-3 mb-6">
  <a href="{% url 'building_list' %}" class="btn-secondary text-sm">← Back to Buildings</a>
  <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ action }} Building</h1>
</div>

{% if messages %}
<div class="mb-4 space-y-2">{% for m in messages %}<div class="px-4 py-2.5 rounded-xl text-sm font-medium bg-red-50 text-red-700 border border-red-200 dark:bg-red-900/20 dark:text-red-400">{{ m }}</div>{% endfor %}</div>
{% endif %}

<form method="post" class="max-w-xl">{% csrf_token %}
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 space-y-4">
    <div class="field-wrapper">
      <label class="field-label">Building Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" value="{{ building.name|default:'' }}" required class="field-input" placeholder="e.g. Building A" />
    </div>
    <div class="field-wrapper">
      <label class="field-label">Code</label>
      <input type="text" name="code" value="{{ building.code|default:'' }}" class="field-input" placeholder="e.g. BLD-A" />
    </div>
    <div class="field-wrapper">
      <label class="field-label">Notes</label>
      <textarea name="notes" rows="3" class="field-input">{{ building.notes|default:'' }}</textarea>
    </div>
    {% if building %}
    <div class="flex items-center gap-2">
      <input type="checkbox" name="is_active" id="isActive" {% if building.is_active %}checked{% endif %} class="w-4 h-4 rounded" />
      <label for="isActive" class="text-sm text-slate-700 dark:text-slate-300">Active</label>
    </div>
    {% endif %}
  </div>
  <div class="flex gap-3 mt-5">
    <button type="submit" class="btn-primary">{{ action }} Building</button>
    <a href="{% url 'building_list' %}" class="btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
