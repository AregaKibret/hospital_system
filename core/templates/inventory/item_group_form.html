{% extends "base.html" %}
{% block title %}{{ action }} Item Group — HMS{% endblock %}
{% block content %}

{% if messages %}
<div class="mb-4 space-y-2">
  {% for msg in messages %}
  <div class="px-4 py-3 rounded-xl text-sm font-medium
    {% if msg.tags == 'error' %}bg-red-50 text-red-800 border border-red-200 dark:bg-red-900/20 dark:text-red-300 dark:border-red-800
    {% else %}bg-blue-50 text-blue-800 border border-blue-200 dark:bg-blue-900/20 dark:text-blue-300 dark:border-blue-800{% endif %}">
    {{ msg }}
  </div>
  {% endfor %}
</div>
{% endif %}

<div class="flex items-center gap-3 mb-6">
  <a href="{% url 'item_group_list' %}" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
  </a>
  <h1 class="text-2xl font-bold text-slate-900 dark:text-white">{{ action }} Item Group</h1>
</div>

<div class="max-w-lg">
  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Name <span class="text-red-500">*</span></label>
      <div class="field-wrapper"><input type="text" name="name" value="{{ group.name|default:'' }}" required></div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Description</label>
      <div class="field-wrapper"><textarea name="description" rows="3">{{ group.description|default:'' }}</textarea></div>
    </div>
    {% if group %}
    <div class="flex items-center gap-2">
      <input type="checkbox" name="is_active" id="is_active" {% if group.is_active %}checked{% endif %} class="rounded">
      <label for="is_active" class="text-sm text-slate-700 dark:text-slate-300">Active</label>
    </div>
    {% endif %}
    <div class="flex items-center gap-3 pt-2 border-t border-slate-100 dark:border-slate-700">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-semibold text-sm transition-colors">{{ action }} Group</button>
      <a href="{% url 'item_group_list' %}" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-xl text-sm font-medium transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
