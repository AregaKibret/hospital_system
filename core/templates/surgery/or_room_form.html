{% extends "base.html" %}
{% block title %}{{ action }} Operating Room{% endblock %}
{% block content %}

<div class="flex items-center gap-3 mb-6">
  <a href="{% url 'surgery_or_room_list' %}" class="btn-secondary text-sm">← Back to Rooms</a>
  <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ action }} Operating Room</h1>
</div>

<form method="post" class="max-w-xl">{% csrf_token %}

  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 space-y-4">
    <div class="field-wrapper">
      <label class="field-label">Room Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" value="{{ room.name|default:'' }}" required class="field-input" placeholder="e.g. OR-1, Cardiac OR" />
    </div>
    <div class="field-wrapper">
      <label class="field-label">Room Type</label>
      <select name="room_type" class="field-input">
        {% for val, label in room_types %}<option value="{{ val }}" {% if room and room.room_type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="field-wrapper">
      <label class="field-label">Location / Floor</label>
      <input type="text" name="location" value="{{ room.location|default:'' }}" class="field-input" placeholder="e.g. 2nd Floor, Block C" />
    </div>
    <div class="field-wrapper">
      <label class="field-label">Capacity (concurrent patients)</label>
      <input type="number" name="capacity" value="{{ room.capacity|default:1 }}" min="1" class="field-input" />
    </div>
    <div class="field-wrapper">
      <label class="field-label">Equipment Available</label>
      <textarea name="equipment" rows="3" class="field-input" placeholder="List key equipment…">{{ room.equipment|default:'' }}</textarea>
    </div>
    <div class="field-wrapper">
      <label class="field-label">Notes</label>
      <textarea name="notes" rows="2" class="field-input">{{ room.notes|default:'' }}</textarea>
    </div>
    {% if room %}
    <div class="flex items-center gap-2">
      <input type="checkbox" name="is_active" id="isActive" {% if room.is_active %}checked{% endif %} class="w-4 h-4 rounded" />
      <label for="isActive" class="text-sm text-slate-700 dark:text-slate-300">Active</label>
    </div>
    {% endif %}
  </div>

  <div class="flex gap-3 mt-5">
    <button type="submit" class="btn-primary">{{ action }} Room</button>
    <a href="{% url 'surgery_or_room_list' %}" class="btn-secondary">Cancel</a>
  </div>

</form>
{% endblock %}
