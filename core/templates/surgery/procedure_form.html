{% extends "base.html" %}
{% block title %}{{ action }} Procedure{% endblock %}
{% block content %}

<div class="flex items-center gap-3 mb-6">
  <a href="{% url 'procedure_master_list' %}" class="btn-secondary text-sm">← Back to List</a>
  <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ action }} Procedure</h1>
</div>

<form method="post">{% csrf_token %}

  <!-- Basic Info -->
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 mb-5">
    <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-4">Basic Information</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="field-wrapper sm:col-span-2">
        <label class="field-label">Procedure Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" value="{{ proc.name|default:'' }}" required class="field-input" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Procedure Code <span class="text-red-500">*</span></label>
        <input type="text" name="code" value="{{ proc.code|default:'' }}" required class="field-input" placeholder="e.g. APPEN-001" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Category</label>
        <select name="category" class="field-input">
          <option value="">— None —</option>
          {% for cat in categories %}<option value="{{ cat.pk }}" {% if proc and proc.category_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper">
        <label class="field-label">Department</label>
        <select name="department" class="field-input">
          <option value="">— None —</option>
          {% for dept in departments %}<option value="{{ dept.pk }}" {% if proc and proc.department_id == dept.pk %}selected{% endif %}>{{ dept.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper">
        <label class="field-label">Required Specialty</label>
        <input type="text" name="required_specialty" value="{{ proc.required_specialty|default:'' }}" class="field-input" placeholder="e.g. General Surgery, Orthopedics" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Estimated Duration (minutes)</label>
        <input type="number" name="estimated_duration_minutes" value="{{ proc.estimated_duration_minutes|default:60 }}" min="1" class="field-input" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Complexity</label>
        <select name="complexity" class="field-input">
          {% for val, label in complexities %}<option value="{{ val }}" {% if proc and proc.complexity == val %}selected{% elif val == 'moderate' and not proc %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper sm:col-span-2">
        <label class="field-label">Description</label>
        <textarea name="description" rows="2" class="field-input">{{ proc.description|default:'' }}</textarea>
      </div>
      {% if proc %}
      <div class="field-wrapper flex items-center gap-2">
        <input type="checkbox" name="is_active" id="isActive" {% if proc.is_active %}checked{% endif %} class="w-4 h-4 rounded" />
        <label for="isActive" class="text-sm text-slate-700 dark:text-slate-300">Active</label>
      </div>
      {% endif %}
    </div>
  </div>

  <!-- Clinical Info -->
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 mb-5">
    <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-4">Clinical Information</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="field-wrapper"><label class="field-label">Indications</label><textarea name="indications" rows="2" class="field-input">{{ proc.indications|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Contraindications</label><textarea name="contraindications" rows="2" class="field-input">{{ proc.contraindications|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Required Investigations</label><textarea name="required_investigations" rows="2" class="field-input">{{ proc.required_investigations|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Required Preparation</label><textarea name="required_preparation" rows="2" class="field-input">{{ proc.required_preparation|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Required Equipment</label><textarea name="required_equipment" rows="2" class="field-input">{{ proc.required_equipment|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Required Medications</label><textarea name="required_medications" rows="2" class="field-input">{{ proc.required_medications|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Required Consumables</label><textarea name="required_consumables" rows="2" class="field-input">{{ proc.required_consumables|default:'' }}</textarea></div>
    </div>
  </div>

  <!-- Resource Requirements -->
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 mb-5">
    <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-4">Resource Requirements</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="field-wrapper">
        <label class="field-label">Required OR Type</label>
        <input type="text" name="or_type_required" value="{{ proc.or_type_required|default:'' }}" class="field-input" placeholder="e.g. General OR, Cardiac OR" />
      </div>
      <div class="field-wrapper">
        <label class="field-label">Required Anesthesia Type</label>
        <select name="required_anesthesia_type" class="field-input">
          {% for val, label in anesthesia_types %}<option value="{{ val }}" {% if proc and proc.required_anesthesia_type == val %}selected{% elif val == 'General' and not proc %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="field-wrapper"><label class="field-label">Required Instruments</label><textarea name="required_instruments" rows="2" class="field-input">{{ proc.required_instruments|default:'' }}</textarea></div>
      <div class="field-wrapper"><label class="field-label">Required Implants / Materials</label><textarea name="required_implants" rows="2" class="field-input">{{ proc.required_implants|default:'' }}</textarea></div>
    </div>
  </div>

  <!-- Financial -->
  <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 mb-5">
    <h2 class="text-sm font-semibold text-slate-900 dark:text-white mb-4">Financial Information (ETB)</h2>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
      <div class="field-wrapper"><label class="field-label">Procedure Fee</label><input type="number" name="procedure_price" value="{{ proc.procedure_price|default:0 }}" min="0" step="0.01" class="field-input" /></div>
      <div class="field-wrapper"><label class="field-label">Surgeon Fee</label><input type="number" name="surgeon_fee" value="{{ proc.surgeon_fee|default:0 }}" min="0" step="0.01" class="field-input" /></div>
      <div class="field-wrapper"><label class="field-label">Anesthesia Fee</label><input type="number" name="anesthesia_fee" value="{{ proc.anesthesia_fee|default:0 }}" min="0" step="0.01" class="field-input" /></div>
      <div class="field-wrapper"><label class="field-label">Facility Fee</label><input type="number" name="facility_fee" value="{{ proc.facility_fee|default:0 }}" min="0" step="0.01" class="field-input" /></div>
      <div class="field-wrapper"><label class="field-label">Consumables</label><input type="number" name="consumable_charges" value="{{ proc.consumable_charges|default:0 }}" min="0" step="0.01" class="field-input" /></div>
      <div class="field-wrapper"><label class="field-label">Insurance Price</label><input type="number" name="insurance_price" value="{{ proc.insurance_price|default:0 }}" min="0" step="0.01" class="field-input" /></div>
    </div>
    <div class="mt-3 field-wrapper">
      <label class="field-label">Billing Category</label>
      <input type="text" name="billing_category" value="{{ proc.billing_category|default:'' }}" class="field-input" placeholder="e.g. Major Surgery, Minor Procedure" />
    </div>
  </div>

  <div class="flex gap-3">
    <button type="submit" class="btn-primary">{{ action }} Procedure</button>
    <a href="{% url 'procedure_master_list' %}" class="btn-secondary">Cancel</a>
  </div>

</form>
{% endblock %}
