{% extends "base.html" %}
{% block title %}Start Physical Inventory Count{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'physical_count_list' %}" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Start Physical Inventory Count</h1>
  </div>

  {% if messages %}
  <div class="mb-4 space-y-2">
    {% for msg in messages %}
    <div class="px-4 py-3 rounded-xl text-sm font-medium bg-red-50 text-red-800 border border-red-200 dark:bg-red-900/20 dark:text-red-300 dark:border-red-800">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-5">
    {% csrf_token %}

    <div class="field-wrapper">
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Store / Location <span class="text-red-500">*</span></label>
      <select name="domain" id="id_domain" required class="w-full text-sm border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100">
        {% for value, label in domain_choices %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field-wrapper" id="dept-store-field" style="display:none">
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Which Department Store? <span class="text-red-500">*</span></label>
      <select name="department_store" class="w-full text-sm border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100">
        <option value="">— Select store —</option>
        {% for ds in department_stores %}
        <option value="{{ ds.id }}">{{ ds.name }} ({{ ds.get_store_type_display }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="field-wrapper">
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Count Type <span class="text-red-500">*</span></label>
      <select name="count_type" required class="w-full text-sm border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100">
        {% for value, label in count_types %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field-wrapper">
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Inventory Period <span class="text-slate-400 font-normal">(optional)</span></label>
      <select name="period" class="w-full text-sm border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100">
        <option value="">— None —</option>
        {% for p in open_periods %}
        <option value="{{ p.id }}">{{ p.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field-wrapper">
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Category <span class="text-slate-400 font-normal">(optional — narrows to one category, for a cycle count)</span></label>
      <select name="category" class="w-full text-sm border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100">
        <option value="">— All categories —</option>
        {% for cat in categories %}
        <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300">
      <input type="checkbox" name="freeze_snapshot" checked class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
      Freeze system quantity snapshot at start (recommended)
    </label>

    <div class="field-wrapper">
      <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Notes</label>
      <textarea name="notes" rows="2" class="w-full text-sm border border-slate-200 dark:border-slate-600 rounded-lg px-3 py-2 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 resize-none"></textarea>
    </div>

    <div class="flex justify-end gap-3 pt-2">
      <a href="{% url 'physical_count_list' %}" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Cancel</a>
      <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold transition-colors">Start Count</button>
    </div>
  </form>
</div>

{% endblock %}

{% block extra_js %}
<script>
(function () {
  var domainSelect = document.getElementById('id_domain');
  var deptField = document.getElementById('dept-store-field');
  function sync() {
    deptField.style.display = domainSelect.value === 'department_store' ? '' : 'none';
  }
  domainSelect.addEventListener('change', sync);
  sync();
})();
</script>
{% endblock %}
