{% extends "base.html" %}
{% block title %}{{ action }} Supplier{% endblock %}
{% block content %}

<div class="mb-5 flex items-center gap-3">
  <a href="{% url 'supplier_list' %}" class="text-sm text-slate-500 hover:text-blue-600 flex items-center gap-1">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Suppliers
  </a>
  <span class="text-slate-300">/</span>
  <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">{{ action }} Supplier</h1>
</div>

<div class="max-w-2xl">
  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 bg-blue-50/50 dark:bg-blue-900/10">
        <h2 class="text-sm font-semibold text-slate-700 dark:text-slate-300">Supplier Details</h2>
      </div>
      <div class="p-6 space-y-4">
        {% with v=sup %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="field-wrapper">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Supplier Name <span class="text-red-500">*</span></label>
            <input type="text" name="name" value="{{ v.name|default:post.name }}" required>
          </div>
          <div class="field-wrapper">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Code <span class="text-red-500">*</span></label>
            <input type="text" name="code" value="{{ v.code|default:post.code }}" required placeholder="e.g. SUP-001">
          </div>
        </div>
        <div class="field-wrapper">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Contact Person</label>
          <input type="text" name="contact_person" value="{{ v.contact_person|default:post.contact_person }}">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="field-wrapper">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Phone</label>
            <input type="text" name="phone" value="{{ v.phone|default:post.phone }}">
          </div>
          <div class="field-wrapper">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
            <input type="email" name="email" value="{{ v.email|default:post.email }}">
          </div>
        </div>
        <div class="field-wrapper">
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Address</label>
          <textarea name="address" rows="2">{{ v.address|default:post.address }}</textarea>
        </div>
        {% endwith %}
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <a href="{% url 'supplier_list' %}" class="px-5 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl hover:bg-slate-50 transition-colors">Cancel</a>
      <button type="submit" class="px-6 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-xl hover:bg-blue-700 transition-colors shadow-sm">
        {{ action }} Supplier
      </button>
    </div>
  </form>
</div>

{% endblock %}
